version: 2

sources:
  - name: gong
    description: >
      Raw data from a Gong pilot deployment. Currently configured for
      RavingFan Inc.'s 3-month pilot across 1,000 sales reps in their
      Canada sales center. Gong was implemented in the last month of Q3
      and became fully operational in Q4. Source name is intentionally
      generic to support multi-customer scalability.
    database: RAW
    schema: GONG

    tables:
      - name: performance_data
        description: >
          Rep-level sales performance data covering the pre-Gong baseline
          period (Q3) and post-Gong deployment period (Q4). Contains deal
          size, deal volume, revenue, and onboarding metrics. One row per
          rep. Note: revenue_q3 is not provided directly in the source and
          is derived in the staging model as avg_deal_size_q3 *
          deal_count_q3.
        columns:
          - name: rep
            description: >
              Unique identifier for each sales representative in the pilot.
              Primary key for joining to gong_data.
            tests:
              - unique
              - not_null

          - name: new_hire
            description: >
              Indicates whether the rep joined the organization during the
              pilot period. Yes = new hire cohort used for onboarding
              analysis. No = experienced rep baseline cohort.
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['Yes', 'No']

          - name: deal_size_q3
            description: >
              Average dollar value per closed deal in the pre-Gong baseline
              period (Q3). Used as the pre-period benchmark for deal size
              analysis.
            tests:
              - not_null

          - name: deal_size_q4
            description: >
              Average dollar value per closed deal in the post-Gong
              deployment period (Q4). Compared to avg_deal_size_q3 to
              measure deal size lift.
            tests:
              - not_null

          - name: number_of_deals_q3
            description: >
              Total number of deals closed by the rep in Q3. Combined with
              avg_deal_size_q3 to derive revenue_q3 in the staging model.
            tests:
              - not_null

          - name: number_of_deals_q4
            description: >
              Total number of deals closed by the rep in Q4. Combined with
              avg_deal_size_q4 to derive revenue_q4 in the staging model.
            tests:
              - not_null

          - name: revenue_per_rep_q3
            description: >
              Total revenue generated by the rep in Q3 as provided in the
              source. Note: the pre-period equivalent (revenue_q3) is not
              provided directly and is derived in staging as
              avg_deal_size_q3 * deal_count_q3.
            tests:
              - not_null

          - name: revenue_per_rep_q4
            description: >
              Total revenue generated by the rep in Q4 as provided in the
              source. Note: the pre-period equivalent (revenue_q3) is not
              provided directly and is derived in staging as
              avg_deal_size_q3 * deal_count_q3.
            tests:
              - not_null

          - name: time_to_first_deal_days
            description: >
              Number of days from the rep's start date to their first closed
              deal. Populated only for new hires (is_new_hire = Yes). NULL
              for experienced reps by design — not a data quality issue.
              Primary metric for onboarding efficiency analysis.

      - name: gong_data
        description: >
          Rep-level Gong platform usage and conversation intelligence data
          captured during Q4. Contains behavioral signals including coaching
          activity, peer learning, deal board engagement, and call quality
          metrics. One row per rep.
        columns:
          - name: REP
            description: >
              Unique identifier for each sales representative. Foreign key
              joining to performance_data. All reps in gong_data should
              have a corresponding record in performance_data.
            tests:
              - unique
              - not_null
              - relationships:
                  arguments:
                    to: source('gong_pilot', 'performance_data')
                    field: rep

          - name: NUM_REPS_CALLS_LISTENED_BY_THEIR_MANAGER
            description: >
              Number of the rep's recorded calls reviewed by their manager
              during the pilot. Proxy for coaching intensity and manager
              engagement with Gong.
            tests:
              - not_null

          - name: NUM_PEER_CALLS_REP_LISTENED_TO
            description: >
              Number of calls recorded by other reps that this rep listened
              to during the pilot. Proxy for self-directed learning and peer
              knowledge sharing behavior.
            tests:
              - not_null

          - name: NUM_TIMES_REP_ACCESSED_THE_DEAL_BOARD
            description: >
              Number of times the rep accessed Gong's deal board during the
              pilot. Indicates engagement with pipeline visibility and deal
              intelligence features.
            tests:
              - not_null

          - name: INTERACTIVITY_SCORE
            description: >
              Gong-generated score (0–1) reflecting the balance of talk time
              between rep and prospect. Higher scores indicate more two-way
              conversation. Lower scores suggest rep over-talking or poor
              discovery habits.
            tests:
              - not_null

          - name: LONGEST_MONOLOGUE_MIN
            description: >
              Duration in minutes of the rep's longest uninterrupted speaking
              segment across calls. Negatively correlated with call quality —
              shorter monologues generally indicate better active listening
              and discovery.
            tests:
              - not_null

          - name: NUM_TIMES_COMPETITOR_WAS_MENTIONED_BY_THE_PROSPECT
            description: >
              Number of times a competitor was raised by the prospect across
              the rep's calls. Useful for competitive intelligence. Note:
              high counts may reflect market context or deal risk rather than
              rep behavior.
            tests:
              - not_null

          - name: NUM_TIMES_REP_USED_NEW_SALES_PITCH
            description: >
              Number of times the rep used the updated sales pitch during
              calls. Tracks adoption of new messaging.
            tests:
              - not_null

          - name: NUM_TIMES_REP_USED_OLD_SALES_PITCH
            description: >
              Number of times the rep used the legacy sales pitch during
              calls. Inversely related to new_pitch_count. High counts may
              indicate a coaching opportunity.
            tests:
              - not_null